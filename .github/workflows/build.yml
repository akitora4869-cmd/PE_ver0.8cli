name: Build Client Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Client Mod
        run: ./gradlew build

      - name: Show generated JARs
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs/

      - name: Upload Client Mod
        uses: actions/upload-artifact@v4
        with:
          name: Project-EVOLVE-Client
          path: |
            build/libs/*.jar
          if-no-files-found: error
