name: Build Client Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Gradle project
        id: gradle
        shell: bash
        run: |
          echo "=== Repository structure ==="
          find . -maxdepth 3 -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

          GRADLEW="$(find . -maxdepth 4 -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found in this repository."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Found gradlew: $GRADLEW"
          echo "Gradle project: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x "${{ steps.gradle.outputs.project_dir }}/gradlew"

      - name: Build Client Mod
        shell: bash
        run: |
          cd "${{ steps.gradle.outputs.project_dir }}"
          ./gradlew build

      - name: Show generated JARs
        shell: bash
        run: |
          echo "=== Generated JAR files ==="
          find "${{ steps.gradle.outputs.project_dir }}/build/libs" \
            -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload Client Mod
        uses: actions/upload-artifact@v4
        with:
          name: Project-EVOLVE-Client
          path: |
            ${{ steps.gradle.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
